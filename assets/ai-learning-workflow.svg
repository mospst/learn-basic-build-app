<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1200 760">
  <title>AI Learning Workflow Map</title>
  <desc>A custom educational diagram showing an AI learning workflow pipeline, a learning pyramid, and an AI tool stack.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafb"/>
      <stop offset="1" stop-color="#eef3f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#18202a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerHeight="12" markerWidth="12" orient="auto" refX="10" refY="6">
      <path d="M1,1 L11,6 L1,11 Z" fill="#24766f"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#paper)"/>
  <rect x="28" y="28" width="1144" height="704" rx="24" fill="#ffffff" stroke="#d8dee3"/>

  <text x="70" y="86" fill="#1c2026" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">AI Learning Workflow Map</text>
  <text x="72" y="124" fill="#626b76" font-family="Arial, Helvetica, sans-serif" font-size="18">Use AI like a careful builder: ask, inspect, build, verify, and learn from the result.</text>

  <g filter="url(#shadow)">
    <rect x="68" y="164" width="1064" height="188" rx="18" fill="#f8fafb" stroke="#d8dee3"/>
  </g>
  <text x="92" y="204" fill="#24766f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">PIPELINE: ONE TASK LOOP</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="92" y="230" width="144" height="74" rx="14" fill="#eef3f1" stroke="#9ac6bd"/>
      <text x="164" y="260" text-anchor="middle" fill="#1c2026" font-size="18" font-weight="800">1 Ask</text>
      <text x="164" y="284" text-anchor="middle" fill="#52606b" font-size="13">goal and outcome</text>
    </g>
    <line x1="244" y1="267" x2="290" y2="267" stroke="#24766f" stroke-width="4" marker-end="url(#arrow)"/>
    <g>
      <rect x="298" y="230" width="144" height="74" rx="14" fill="#f4ece9" stroke="#d9a79b"/>
      <text x="370" y="260" text-anchor="middle" fill="#1c2026" font-size="18" font-weight="800">2 Context</text>
      <text x="370" y="284" text-anchor="middle" fill="#52606b" font-size="13">facts and files</text>
    </g>
    <line x1="450" y1="267" x2="496" y2="267" stroke="#24766f" stroke-width="4" marker-end="url(#arrow)"/>
    <g>
      <rect x="504" y="230" width="144" height="74" rx="14" fill="#f3f0e5" stroke="#d9bc74"/>
      <text x="576" y="260" text-anchor="middle" fill="#1c2026" font-size="18" font-weight="800">3 Tools</text>
      <text x="576" y="284" text-anchor="middle" fill="#52606b" font-size="13">terminal, MCP</text>
    </g>
    <line x1="656" y1="267" x2="702" y2="267" stroke="#24766f" stroke-width="4" marker-end="url(#arrow)"/>
    <g>
      <rect x="710" y="230" width="144" height="74" rx="14" fill="#edf0f8" stroke="#9fadd6"/>
      <text x="782" y="260" text-anchor="middle" fill="#1c2026" font-size="18" font-weight="800">4 Build</text>
      <text x="782" y="284" text-anchor="middle" fill="#52606b" font-size="13">small changes</text>
    </g>
    <line x1="862" y1="267" x2="908" y2="267" stroke="#24766f" stroke-width="4" marker-end="url(#arrow)"/>
    <g>
      <rect x="916" y="230" width="144" height="74" rx="14" fill="#eef3f1" stroke="#9ac6bd"/>
      <text x="988" y="260" text-anchor="middle" fill="#1c2026" font-size="18" font-weight="800">5 Verify</text>
      <text x="988" y="284" text-anchor="middle" fill="#52606b" font-size="13">test and inspect</text>
    </g>
  </g>
  <path d="M988 316 C988 360, 164 360, 164 316" fill="none" stroke="#c85442" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="566" y="342" fill="#c85442" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">Reflect, improve prompt, repeat</text>

  <g filter="url(#shadow)">
    <rect x="68" y="390" width="512" height="294" rx="18" fill="#ffffff" stroke="#d8dee3"/>
  </g>
  <text x="92" y="430" fill="#455d9a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">PYRAMID: HOW YOUR SKILL GROWS</text>
  <polygon points="324,466 148,646 500,646" fill="#edf0f8" stroke="#9fadd6"/>
  <polygon points="324,466 202,590 446,590" fill="#f3f0e5" stroke="#d9bc74"/>
  <polygon points="324,466 254,536 394,536" fill="#f4ece9" stroke="#d9a79b"/>
  <polygon points="324,466 294,498 354,498" fill="#eef3f1" stroke="#9ac6bd"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="324" y="493" fill="#1c2026" font-size="14" font-weight="800">Judgment</text>
    <text x="324" y="527" fill="#1c2026" font-size="15" font-weight="800">Debugging</text>
    <text x="324" y="581" fill="#1c2026" font-size="16" font-weight="800">Tools and Git</text>
    <text x="324" y="630" fill="#1c2026" font-size="17" font-weight="800">Terminal, files, VS Code</text>
  </g>
  <text x="92" y="666" fill="#626b76" font-family="Arial, Helvetica, sans-serif" font-size="15">Do not skip the base. AI gets easier when the basics feel normal.</text>

  <g filter="url(#shadow)">
    <rect x="620" y="390" width="512" height="294" rx="18" fill="#ffffff" stroke="#d8dee3"/>
  </g>
  <text x="644" y="430" fill="#b57f21" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">STACK: WHAT AN AI AGENT CAN USE</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="684" y="456" width="384" height="42" rx="10" fill="#20252c"/>
    <text x="876" y="483" text-anchor="middle" fill="#f7f8fa" font-size="17" font-weight="800">AI Agent: plan, edit, explain</text>
    <rect x="708" y="506" width="336" height="42" rx="10" fill="#24766f"/>
    <text x="876" y="533" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">MCP and tools: browser, docs, data</text>
    <rect x="732" y="556" width="288" height="42" rx="10" fill="#455d9a"/>
    <text x="876" y="583" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">CLI: git, npm, tests, servers</text>
    <rect x="756" y="606" width="240" height="42" rx="10" fill="#c85442"/>
    <text x="876" y="633" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">Files: code, config, docs</text>
  </g>
  <text x="644" y="674" fill="#626b76" font-family="Arial, Helvetica, sans-serif" font-size="15">Inspect bottom up: files, CLI, tools, then AI reasoning.</text>
</svg>
